<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>HSK 5급 단어장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one narrow study column; a big hanzi card in the middle, answer slot reserved beneath it, buttons pinned under the card. */
:root{
  --bg:#eef1ef; --surface:#ffffff; --ink:#18201c; --muted:#5d6b64; --line:#d3dbd6;
  --jade:#2f7a5f; --jade-soft:#dcebe4; --jade-ink:#ffffff;
  --know:#2f7a5f; --dunno:#b2463a; --dunno-soft:#f5e1de;
  --t1:#2b6cb0; --t2:#2f855a; --t3:#b7791f; --t4:#c53030;
  --f-hz:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-py:"Source Sans 3","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1b2420; --ink:#e7ede9; --muted:#9aaba2; --line:#2e3a34;
  --jade:#5fb894; --jade-soft:#20352c; --jade-ink:#0e1612;
  --know:#5fb894; --dunno:#e57b6d; --dunno-soft:#3a2321;
  --t1:#7fb2ec; --t2:#6fcf97; --t3:#e3b55a; --t4:#f08080; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1b2420; --ink:#e7ede9; --muted:#9aaba2; --line:#2e3a34;
  --jade:#5fb894; --jade-soft:#20352c; --jade-ink:#0e1612;
  --know:#5fb894; --dunno:#e57b6d; --dunno-soft:#3a2321;
  --t1:#7fb2ec; --t2:#6fcf97; --t3:#e3b55a; --t4:#f08080; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ko);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px;box-sizing:border-box}
header{display:flex;align-items:center;gap:12px;min-height:40px}
header h1{font-size:15px;font-weight:700;margin:0;flex:1;letter-spacing:.01em}
.back{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.save{font-size:12px;color:var(--muted)}
button{font-family:var(--f-ko)}
button:focus-visible,.tab:focus-visible{outline:3px solid var(--jade);outline-offset:2px}

/* home */
.hero{display:flex;flex-direction:column;gap:6px;padding-block:24px 8px}
.hero .hz{font-family:var(--f-hz);font-size:64px;font-weight:700;line-height:1;letter-spacing:.04em}
.hero p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-py);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.k b{color:var(--know)} .stat.u b{color:var(--dunno)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.menu{display:flex;flex-direction:column;gap:10px}
.big{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:18px 18px;font-size:17px;font-weight:700;cursor:pointer}
.big small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.big .n{font-family:var(--f-py);font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.big.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.big.primary small,.big.primary .n{color:var(--jade-ink);opacity:.85}
.big:hover{border-color:var(--jade)}
.order{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-inline:4px}
.order span{margin-right:4px}
.order button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.order button[aria-checked="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:700}
.credit{font-family:var(--f-py);font-size:12px;font-weight:400;letter-spacing:.04em;color:var(--muted);margin-left:8px;white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin:0}
.reset{align-self:flex-start;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:4px 0}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--dunno-soft);border-radius:10px;padding:12px;font-size:14px}
.confirm button{border-radius:8px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:14px}
.confirm button.danger{background:var(--dunno);border-color:var(--dunno);color:var(--surface)}

/* card */
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 20px;min-height:280px;text-align:center}
.card .hz{font-family:var(--f-hz);font-weight:700;font-size:clamp(56px,18vw,96px);line-height:1.1;letter-spacing:.06em;word-break:keep-all}
.card .hz.long{font-size:clamp(36px,10vw,56px)}
.tag{font-size:12px;border-radius:999px;padding:2px 10px}
.tag.k{background:var(--jade-soft);color:var(--know)} .tag.u{background:var(--dunno-soft);color:var(--dunno)}
.ans{min-height:84px;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.ans .py{font-family:var(--f-py);font-size:26px;font-weight:600;letter-spacing:.01em}
.ans .mean{font-size:17px;max-width:40ch}
.ans .hint{color:var(--muted);font-size:13px;padding-top:24px}
.ans .fix{font-size:12px;color:var(--muted)}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{border-radius:12px;padding:16px 10px;font-size:17px;font-weight:700;cursor:pointer;border:1px solid var(--line)}
.btns .check{grid-column:1/-1;background:var(--surface);color:var(--ink)}
.btns .yes{background:var(--know);border-color:var(--know);color:var(--surface)}
.btns .no{background:var(--dunno);border-color:var(--dunno);color:var(--surface)}
.btns kbd{font-family:var(--f-py);font-size:11px;font-weight:400;opacity:.7;margin-left:6px}
.keys{text-align:center;font-size:12px;color:var(--muted);margin:0}
.done{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.done h2{margin:0;font-size:20px}
.done p{margin:0;color:var(--muted)}

/* list */
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.tab{border:none;background:none;color:var(--muted);padding:12px;font-size:15px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"].k{background:var(--jade-soft);color:var(--know)}
.tab[aria-selected="true"].u{background:var(--dunno-soft);color:var(--dunno)}
.tab span{font-family:var(--f-py);font-variant-numeric:tabular-nums;font-weight:600}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.hz{font-family:var(--f-hz);font-size:20px;font-weight:700;white-space:nowrap}
td.py{font-family:var(--f-py);font-size:16px;white-space:nowrap}
td.mn{font-size:14px;min-width:10em}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty button{border-radius:10px;padding:10px 16px;border:none;background:var(--jade);color:var(--jade-ink);font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.card .hz{transition:opacity .15s}}
</style>

<div class="wrap" id="app"></div>

const TONEMAP={'ā':1,'ē':1,'ī':1,'ō':1,'ū':1,'ǖ':1,'á':2,'é':2,'í':2,'ó':2,'ú':2,'ǘ':2,'ǎ':3,'ě':3,'ǐ':3,'ǒ':3,'ǔ':3,'ǚ':3,'à':4,'è':4,'ì':4,'ò':4,'ù':4,'ǜ':4};
function pyKey(py){let base='',tones='';for(const ch of py.toLowerCase()){const t=TONEMAP[ch];if(t)tones+=t;const b=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(/[a-z]/.test(b))base+=(ch==='ü'||'ǖǘǚǜ'.includes(ch))?'u~':b}return[base,tones]}
const ALPHA=[...W].sort((a,b)=>{const [x,tx]=pyKey(a.py),[y,ty]=pyKey(b.py);return x<y?-1:x>y?1:tx<ty?-1:tx>ty?1:a.id-b.id}).map(w=>w.id);
const ORDER_KEY='hsk5-order';
let order='alpha';try{const o=localStorage.getItem(ORDER_KEY);if(o==='alpha'||o==='random')order=o}catch(e){}
function setOrder(o){order=o;try{localStorage.setItem(ORDER_KEY,o)}catch(e){}render()}
const FILLED=new Set([1332, 1335, 2355]); // PDF에 뜻이 없어 보충한 단어
let S={}; // id -> 'k' | 'u'
let view={name:'home'};
let saveState='';
const LS='hsk5-status-v1';
let db=null, docRef=null, saveTimer=null;

function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v)return v}catch(e){}return null}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(pack()))}catch(e){}}
function pack(){const k=[],u=[];for(const [id,v] of Object.entries(S))(v==='k'?k:u).push(+id);return{k,u,updated:Date.now()}}
function unpack(o){S={};(o.k||[]).forEach(i=>S[i]='k');(o.u||[]).forEach(i=>S[i]='u')}

function persist(){
  lsSave();
  if(!docRef)return;
  clearTimeout(saveTimer);
  setSave('저장 중…');
  saveTimer=setTimeout(async()=>{
    try{await docRef.set(pack());setSave('저장됨')}catch(e){setSave('이 기기에만 저장됨')}
  },900);
}
function setSave(t){saveState=t;const el=document.getElementById('save');if(el)el.textContent=t}

const local=lsLoad(); if(local)unpack(local);

(async()=>{
  try{
    const [d,u]=await Promise.all([window.claude?.use?.('db'),window.claude?.use?.('user')]);
    if(!d||!u)return;
    const uid=await u.id(); if(!uid)return;
    db=d; docRef=db.doc('data/users/'+uid+'/progress');
    const snap=await docRef.get();
    if(snap.exists){const r=snap.data();const lu=local?.updated||0;if((r.updated||0)>=lu){unpack(r);lsSave()}else persist()}
    else if(local) persist();
    setSave('계정에 저장됨'); render();
  }catch(e){}
})();

function counts(){let k=0,u=0;for(const v of Object.values(S))v==='k'?k++:u++;return{k,u,n:W.length-k-u}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const TONES={1:'āēīōūǖ',2:'áéíóúǘ',3:'ǎěǐǒǔǚ',4:'àèìòùǜ'};
function toneHtml(py){let out='';for(const ch of py){let t=0;for(const k in TONES)if(TONES[k].includes(ch))t=k;out+=t?`<span class="t${t}">${esc(ch)}</span>`:esc(ch)}return out}
function fmt(n){return n.toLocaleString('ko-KR')}

function go(v){view=v;render();window.scrollTo(0,0)}
function startCards(mode){
  let ids;
  if(mode==='all'){ids=ALPHA.filter(id=>!S[id]);if(order==='random')shuffle(ids)}
  else ids=shuffle(W.filter(w=>S[w.id]===mode).map(w=>w.id));
  go({name:'card',mode,ids,i:0,shown:false,moved:0});
}

function header(title,back){
  return `<header>${back?`<button class="back" data-go="${back}">← ${back==='home'?'메인':'학습'}</button>`:''}<h1>${title}${back?'':'<span class="credit">made by 오기택</span>'}</h1><span class="save" id="save">${saveState}</span></header>`;
}

function render(){
  const app=document.getElementById('app');const c=counts();
  if(view.name==='home'){
    const pk=c.k/W.length*100,pu=c.u/W.length*100;
    app.innerHTML=`${header('HSK 5급 단어장')}
    <section class="hero"><div class="hz" lang="zh">汉语五级</div><p>新 HSK 必須 語彙集 · ${fmt(W.length)}단어</p></section>
    <div class="stats"><div class="stat k"><b>${fmt(c.k)}</b><span>안다</span></div><div class="stat u"><b>${fmt(c.u)}</b><span>모른다</span></div><div class="stat"><b>${fmt(c.n)}</b><span>아직 안 봄</span></div></div>
    <div class="bar" aria-hidden="true"><i style="width:${pk}%;background:var(--know)"></i><i style="width:${pu}%;background:var(--dunno)"></i></div>
    <div class="menu">
      <button class="big primary" data-act="all"><span>플래시카드<small>${c.n?(order==='alpha'?'병음 알파벳순 · 안 본 단어부터 이어서':'무작위 · 안 본 단어만 섞어서'):'모든 단어를 분류했어요'}</small></span><span class="n">${fmt(c.n)}개 남음</span></button>
      <div class="order" role="radiogroup" aria-label="플래시카드 순서"><span>카드 순서</span><button role="radio" aria-checked="${order==='alpha'}" data-order="alpha">병음 알파벳순</button><button role="radio" aria-checked="${order==='random'}" data-order="random">무작위</button></div>
      <button class="big" data-go="study"><span>학습<small>아는 단어 · 모르는 단어 · 단어리스트</small></span><span class="n">→</span></button>
    </div>`;
  }
  else if(view.name==='study'){
    app.innerHTML=`${header('학습','home')}
    <div class="menu">
      <button class="big" data-act="k"><span>아는 단어만<small>안다로 고른 단어를 섞어서 다시 시험</small></span><span class="n" style="color:var(--know)">${fmt(c.k)}개</span></button>
      <button class="big" data-act="u"><span>모르는 단어만<small>모른다로 고른 단어를 섞어서 다시 시험</small></span><span class="n" style="color:var(--dunno)">${fmt(c.u)}개</span></button>
      <button class="big" data-list="u"><span>단어리스트<small>한자 · 병음 · 뜻을 표로 보기</small></span><span class="n">→</span></button>
    </div>
    <p class="note">다시 시험 볼 때 반대 버튼을 누르면 그 단어는 반대쪽 리스트로 옮겨집니다.</p>
    ${view.confirm?`<div class="confirm" role="alert"><span>안다·모른다 기록 ${fmt(c.k+c.u)}개를 모두 지울까요?</span><button class="danger" data-act="reset-yes">모두 지우기</button><button data-act="reset-no">취소</button></div>`:`<button class="reset" data-act="reset">기록 초기화</button>`}`;
  }
  else if(view.name==='card'){
    const v=view, title={all:'플래시카드',k:'아는 단어 시험',u:'모르는 단어 시험'}[v.mode];
    const back=v.mode==='all'?'home':'study';
    if(!v.ids.length){
      const msg=v.mode==='all'?'모든 단어를 안다·모른다로 분류했어요.':(v.mode==='k'?'아직 안다로 고른 단어가 없어요.':'모르는 단어가 없어요.');
      app.innerHTML=`${header(title,back)}<div class="empty"><p>${msg}</p>${v.mode==='all'?'<button data-go="study">학습으로 가기</button>':'<button data-act="all">플래시카드로 분류하기</button>'}</div>`;
    } else if(v.i>=v.ids.length){
      const c2=counts();
      app.innerHTML=`${header(title,back)}<div class="done"><h2>${fmt(v.ids.length)}장을 다 봤어요</h2>
      <p>지금 안다 ${fmt(c2.k)} · 모른다 ${fmt(c2.u)}${v.mode!=='all'&&v.moved?` · 이번에 ${fmt(v.moved)}개 옮김`:''}</p>
      <div class="menu" style="width:100%">${v.mode!=='all'?`<button class="big primary" data-act="${v.mode}"><span>한 번 더</span><span class="n">${fmt(v.mode==='k'?c2.k:c2.u)}개</span></button>`:''}<button class="big" data-go="study"><span>학습 메뉴</span><span class="n">→</span></button></div></div>`;
    } else {
      const w=BY.get(v.ids[v.i]);const st=S[w.id];
      const done=v.mode==='all'?(W.length-(v.ids.length-v.i)):v.i;
      app.innerHTML=`${header(title,back)}
      <div class="prog"><span>${v.mode==='all'?`분류 ${fmt(done)} / ${fmt(W.length)}`:`${fmt(v.i+1)} / ${fmt(v.ids.length)}`}</span><span>No. ${w.id}</span></div>
      <div class="card">
        ${v.mode!=='all'&&st?`<span class="tag ${st}">${st==='k'?'안다':'모른다'}</span>`:''}
        <div class="hz${w.hz.length>4?' long':''}" lang="zh">${esc(w.hz)}</div>
        <div class="ans" aria-live="polite">${v.shown?`<div class="py" lang="zh-Latn">${toneHtml(w.py)}</div><div class="mean">${esc(w.mn)}</div>${FILLED.has(w.id)?'<div class="fix">PDF에 뜻이 비어 있어 보충한 뜻</div>':''}`:'<div class="hint">답안확인을 누르면 병음과 뜻이 나옵니다</div>'}</div>
      </div>
      <div class="btns">
        <button class="check" data-act="show">답안확인<kbd>Space</kbd></button>
        <button class="yes" data-act="mark-k">안다<kbd>1</kbd></button>
        <button class="no" data-act="mark-u">모른다<kbd>2</kbd></button>
      </div>`;
    }
  }
  else if(view.name==='list'){
    const t=view.tab;const rows=W.filter(w=>S[w.id]===t);
    app.innerHTML=`${header('단어리스트','study')}
    <div class="tabs" role="tablist"><button class="tab k" role="tab" aria-selected="${t==='k'}" data-list="k">아는 단어 <span>${fmt(c.k)}</span></button><button class="tab u" role="tab" aria-selected="${t==='u'}" data-list="u">모르는 단어 <span>${fmt(c.u)}</span></button></div>
    ${rows.length?`<div class="tablebox"><table><thead><tr><th>중국어</th><th>병음</th><th>뜻</th></tr></thead><tbody>${rows.map(w=>`<tr><td class="hz" lang="zh">${esc(w.hz)}</td><td class="py">${toneHtml(w.py)}</td><td class="mn">${esc(w.mn)}</td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty"><p>${t==='k'?'안다':'모른다'}로 고른 단어가 아직 없어요.</p><button data-act="all">플래시카드로 분류하기</button></div>`}`;
  }
}

function act(a){
  if(a==='all'||a==='k'||a==='u')return startCards(a);
  if(a==='reset'){view.confirm=true;return render()}
  if(a==='reset-no'){view.confirm=false;return render()}
  if(a==='reset-yes'){S={};persist();view.confirm=false;return render()}
  if(view.name!=='card'||view.i>=view.ids.length)return;
  if(a==='show'){view.shown=true;return render()}
  if(a==='mark-k'||a==='mark-u'){
    const id=view.ids[view.i],to=a==='mark-k'?'k':'u';
    if(view.mode!=='all'&&S[id]!==to)view.moved++;
    S[id]=to;persist();view.i++;view.shown=false;render();
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go)go({name:b.dataset.go});
  else if(b.dataset.order)setOrder(b.dataset.order);
  else if(b.dataset.list)go({name:'list',tab:b.dataset.list});
  else if(b.dataset.act)act(b.dataset.act);
});
document.addEventListener('keydown',e=>{
  if(view.name!=='card'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key===' '||e.key==='Enter'){if(document.activeElement?.tagName==='BUTTON'&&e.key==='Enter')return;e.preventDefault();act('show')}
  else if(e.key==='1')act('mark-k');
  else if(e.key==='2')act('mark-u');
});
render();
</script>

</body>
</html>
